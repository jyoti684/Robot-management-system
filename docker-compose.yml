services:
  virtual-robot:
    build:
      context: ./virtual_robot
    container_name: rms-virtual-robot
    environment:
      ROBOT_ADMIN_TOKEN: ${ROBOT_ADMIN_TOKEN:-demo-admin-token}
      ROBOT_INITIAL_BATTERY: "100"
      ROBOT_LATENCY_MS: "75"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    container_name: rms-dashboard
    environment:
      ROBOT_API_URL: http://virtual-robot:8001
      DATABASE_URL: sqlite:////data/rms.db
      SECRET_KEY: ${RMS_SECRET_KEY:-development-only-change-me}
      COMMANDER_USERNAME: ${RMS_COMMANDER_USERNAME:-commander}
      COMMANDER_PASSWORD: ${RMS_COMMANDER_PASSWORD:-Commander123!}
      VIEWER_USERNAME: ${RMS_VIEWER_USERNAME:-viewer}
      VIEWER_PASSWORD: ${RMS_VIEWER_PASSWORD:-Viewer123!}
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - rms-data:/data
    depends_on:
      virtual-robot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 8s
    restart: unless-stopped

volumes:
  rms-data:
